<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NCLEX Practice Test - Verified Case Sets (Corrected)</title>
  <style>
    :root{--bg:#eef1f5;--card:#fff;--tx:#1d2733;--mu:#667487;--bd:#d6dce4;--hd:#0b5ea8;--tb:#6ea6dc;--ok:#1a7f45;--okb:#e3f4ec;--no:#b3261e;--nob:#fdecea;--sel:#dceaf8;--bad:#b3261e}
    @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f141a;--card:#18202a;--tx:#e6ebf1;--mu:#95a2b3;--bd:#2c3744;--hd:#0b4f8c;--tb:#2f5f8f;--ok:#4cc27f;--okb:#12301f;--no:#ff8a80;--nob:#3a1a17;--sel:#1d3a55;--bad:#ff8a80}}
    *{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--tx);font:15px/1.5 Arial,Helvetica,sans-serif}
    #app{min-height:100%;display:flex;flex-direction:column}
    .hd{background:var(--hd);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;font-size:12.5px;flex-wrap:wrap}
    .hd .l{line-height:1.35}.hd .r{display:flex;gap:6px}
    .hd button{font:inherit;font-size:12px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;padding:4px 10px;border-radius:6px;cursor:pointer}
    .main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);min-height:0}
    .pane{overflow:auto;padding:14px 16px;background:var(--card)}
    .pane+.pane{border-left:1px solid var(--bd)}
    @media(max-width:760px){.main{display:block;overflow:auto}.pane{overflow:visible}.pane+.pane{border-left:0;border-top:1px solid var(--bd)}}
    .c{font-size:12px;color:var(--mu);margin:0 0 8px}
    .item{font-weight:700;margin:0 0 6px;font-size:15px}
    .stem{font-size:16px;margin:8px 0 12px}
    .ins{color:var(--hd);font-weight:700;margin:0 0 8px}
    .opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;margin:6px 0;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer}
    .opt.sel{background:var(--sel);border-color:var(--hd)}
    .opt.ok{background:var(--okb);border-color:var(--ok)}
    .opt.no{background:var(--nob);border-color:var(--no)}
    .opt .k{flex:none;width:22px;height:22px;border:1.5px solid var(--mu);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
    .opt.ok .k{border-color:var(--ok);color:var(--ok)}
    .opt.no .k{border-color:var(--no);color:var(--no)}
    .mark{margin-left:auto;font-weight:700}
    .ok .mark{color:var(--ok)}.no .mark{color:var(--no)}
    .mxrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
    .mxrow:last-child{border-bottom:0}
    .mxrow .lbl{flex:1;min-width:200px}
    .mxbtn{font:inherit;font-size:13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:4px 10px;border-radius:6px;cursor:pointer}
    .mxbtn.on{background:var(--sel);border-color:var(--hd);font-weight:700}
    .sc{border-left:4px solid var(--ok);background:var(--bg);padding:8px 12px;margin:12px 0;font-size:13px;display:flex;gap:16px;flex-wrap:wrap}
    .sc.bad{border-left-color:var(--no)}
    .sc b{font-size:14px}
    .exp{border-top:1px solid var(--bd);padding-top:8px}
    .exp h4{margin:6px 0;color:var(--hd)}
    .btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 16px;border-radius:8px;cursor:pointer}
    .btn.p{background:var(--hd);border-color:var(--hd);color:#fff;font-weight:700}
    .btn:disabled{opacity:.45;cursor:default}
    .ft{background:var(--hd);color:#fff;display:flex;align-items:center;padding:8px 12px;gap:8px;flex-wrap:wrap}
    .ft .sp{flex:1}
    .ft button{font:inherit;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;padding:5px 14px;border-radius:6px;cursor:pointer}
    .ft button:disabled{opacity:.4;cursor:default}
    .chip{color:var(--mu);font-size:13px}
    .flagbtn.on{background:#f6a821;border-color:#f6a821;color:#1d2733;font-weight:700}
    .home{max-width:860px;margin:0 auto;padding:18px;width:100%}
    .home .card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:16px 18px;margin-bottom:14px}
    .home label{display:block;font-weight:700;margin:12px 0 4px;font-size:13px}
    .home select{font:inherit;width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
    table.sum{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
    table.sum th,table.sum td{border:1px solid var(--bd);padding:5px 8px;text-align:left;vertical-align:top}
    table.sum th{background:var(--bg);color:var(--mu);font-weight:700}
    .fix{color:var(--no);font-weight:700}
    .okc{color:var(--ok);font-weight:700}
    .big{font-size:24px;font-weight:700;margin:8px 0}
    .grid{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
    .grid button{font:inherit;border:1px solid var(--no);background:var(--nob);color:var(--no);padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:700}
    table.res{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
    table.res th,table.res td{border:1px solid var(--bd);padding:5px 8px;text-align:left}
    table.res th{background:var(--bg);color:var(--mu)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
    .mb{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:16px;max-width:420px;width:92%;position:relative}
    .mb button.x{position:absolute;top:8px;right:8px}
    .mb textarea,.mb input{font:inherit;width:100%;margin-top:8px;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
    .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
    .kp button{font:inherit;padding:10px 0;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:6px;cursor:pointer}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="mod"></div>
  <script>
    const ACCT='6300643';
    const D={"items":[
      {"id":1,"qid":"11552","topic":"Stevens-Johnson Syndrome","type":"single","fix":"Topic corrected: stem describes SJS (blistering rash + mucosal erosions after a new antibiotic), not anaphylaxis.","opts":["Apply a topical corticosteroid to the affected areas.","Discontinue the suspected offending medication immediately.","Obtain a wound culture from the blistered areas.","Administer an oral antihistamine for pruritus."],"ans":[2],"stem":"The nurse is caring for a client who has developed a widespread blistering rash and mucosal erosions after starting a new antibiotic. Which of the following actions should the nurse take first?","exp":["The clinical presentation is highly suggestive of Stevens-Johnson Syndrome (SJS), a severe, life-threatening mucocutaneous reaction often triggered by medications. The absolute first priority is to discontinue the causative agent to prevent further progression of the disease."],"set":9,"tid":"419530942","vset":1},
      {"id":2,"qid":"11552","topic":"Anaphylaxis","type":"single","fix":null,"opts":["IV diphenhydramine push","Intramuscular (IM) epinephrine","Nebulized albuterol","IV methylprednisolone"],"ans":[2],"stem":"Complete the following sentence by choosing from the list of options. The nurse recognizes the client is experiencing anaphylaxis and should anticipate an immediate order for ______________.","exp":["IM epinephrine is the first-line, life-saving treatment for anaphylaxis. It acts rapidly to cause vasoconstriction (reversing hypotension and edema) and bronchodilation (reversing wheezing and hypoxia). Antihistamines and corticosteroids are secondary treatments."],"set":9,"tid":"419530942","vset":1},
      {"id":3,"qid":"44891","topic":"Lithium Therapy","type":"single","fix":null,"opts":["Continue taking lithium at the current dose.","Discontinue lithium immediately and switch to valproic acid.","Administer IV sodium polystyrene sulfonate.","Hold the next dose of lithium and recheck levels in 4 hours."],"ans":[1],"stem":"The nurse is talking with a client who is receiving lithium. The client has a therapeutic serum lithium level and reports increased urination. Which of the following orders should the nurse expect?","exp":["Mild polyuria and thirst are common, expected side effects of therapeutic lithium levels due to its effect on the kidneys (nephrogenic diabetes insipidus). Since the level is therapeutic and renal function is normal, the nurse should expect the provider to continue the current dose while monitoring."],"set":3,"tid":"418225859","vset":1},
      {"id":4,"qid":"44988","topic":"Sickle Cell","type":"highlight","fix":null,"opts":["Pain rated as 9/10 in the upper back, knees, and lower legs","Restlessness and facial grimacing","Heart rate of 120 bpm","Reticulocyte count of 5%","SpO2 95% on room air with respiratory rate of 24 breaths/min"],"ans":[1,2,3,5],"stem":"Click to highlight the 4 findings below that require immediate follow-up.","exp":["Sickle cell acute pain episodes result from vaso-occlusive ischemia and cause tachycardia, leukocytosis, reticulocytosis, and bone pain. The elevated reticulocyte count is an expected compensatory response to chronic hemolysis, but the pain, tachycardia, and tachypnea require immediate intervention."],"set":9,"tid":"418225859","vset":1},
      {"id":5,"qid":"44891","topic":"Sickle Cell","type":"single","fix":"Topic corrected: stem and explanation describe a vaso-occlusive crisis (sickle cell), not lithium therapy.","opts":["Subcutaneous enoxaparin","IV opioid analgesics and aggressive IV hydration","Oral hydroxyurea as a stat dose","Immediate blood transfusion of packed RBCs"],"ans":[2],"stem":"Complete the following sentence by choosing from the list of options. The nurse recognizes that the client is experiencing a vaso-occlusive crisis and should anticipate an order for ______________.","exp":["The priority treatment for a sickle cell vaso-occlusive crisis is rapid pain management (typically with IV opioids) and aggressive IV hydration to decrease blood viscosity, improve microcirculation, and help clear sickled cells."],"set":5,"tid":"418225859","vset":1},
      {"id":6,"qid":"40238","topic":"STEMI","type":"matrix","fix":null,"opts":["Administer chewable aspirin 324 mg PO","Administer sublingual nitroglycerin","Prepare the client for percutaneous coronary intervention (PCI)","Obtain a stat D-dimer level"],"ans":[1,2,3],"stem":"For each potential intervention, click to specify if the intervention is anticipated or not anticipated for the immediate care of this client.","exp":["For a client diagnosed with STEMI, the nurse should anticipate maintaining airway patency, administering aspirin to decrease platelet aggregation, giving nitroglycerin to promote coronary artery vasodilation, and preparing the client for immediate reperfusion therapy (e.g., PCI)."],"set":2,"tid":"419506277","vset":1},
      {"id":8,"qid":"11552","topic":"Tetralogy of Fallot","type":"matrix","fix":"Topic corrected: interventions describe tet-spell management (morphine, oxygen, IV fluids for preload), not anaphylaxis.","opts":["Administer IV morphine sulfate","Provide 100% supplemental oxygen via blow-by","Encourage the parent to continue comforting the child loudly","Administer IV fluids to increase preload"],"ans":[1,2,4],"stem":"For each potential intervention, click to specify if the intervention is anticipated or not anticipated for the care of this client.","exp":["If knee-chest positioning is insufficient, medical management includes calming the child (morphine), providing oxygen, and administering IV fluids to increase preload and push more blood through the pulmonary circulation."],"set":9,"tid":"419530942","vset":1},
      {"id":9,"qid":"11779","topic":"Diabetic Ketoacidosis","type":"highlight","fix":null,"opts":["Confusion and deep, rapid breathing (Kussmaul respirations)","Dry mucous membranes and poor skin turgor","Blood pressure of 92/60 mm Hg and heart rate of 122 bpm","Random glucose of 573 mg/dL and pH of 7.25","Temperature of 100.4\u00b0F (38.0\u00b0C)"],"ans":[1,2,3,4],"stem":"Click to highlight the 4 findings below that require immediate follow-up.","exp":["These findings indicate Diabetic Ketoacidosis (DKA) with moderate to severe dehydration and metabolic acidosis. Kussmaul respirations are a compensatory mechanism to blow off excess CO2. Hypotension and tachycardia indicate hypovolemia requiring immediate fluid resuscitation."],"set":9,"tid":"418215528","vset":1},
      {"id":10,"qid":"11779","topic":"Diabetic Ketoacidosis","type":"matrix","fix":null,"opts":["Initiate IV fluid resuscitation with 0.9% NaCl","Start continuous IV regular insulin infusion","Administer subcutaneous long-acting insulin","Frequent checks of arterial blood gas levels"],"ans":[1,2,4],"stem":"For each potential intervention, click to specify if the intervention is anticipated or not anticipated for the care of this client.","exp":["The priority treatment for DKA is aggressive IV fluid resuscitation to restore intravascular volume, followed by a continuous IV regular insulin infusion to lower blood glucose and halt ketone production. Subcutaneous long-acting insulin is not appropriate for acute management."],"set":9,"tid":"418215528","vset":1},
      {"id":11,"qid":"11450","topic":"Ankylosing Spondylitis","type":"multi","fix":null,"opts":["I should practice daily stretching and spine-stretching exercises.","Swimming is a good form of exercise for me because it promotes spine extension.","I should rest in bed as much as possible to avoid worsening the pain.","I need to stop smoking to reduce the risk of lung complications."],"ans":[1,2,4],"stem":"The nurse is teaching a client newly diagnosed with ankylosing spondylitis. Which of the following statements by the client would indicate a correct understanding of the teaching? Select all that apply.","exp":["Management of ankylosing spondylitis focuses on maintaining spinal mobility and posture. Exercises that promote spine extension (e.g., swimming) are highly recommended. Bed rest is discouraged as it worsens stiffness. Smoking cessation is critical because the disease can restrict chest expansion, and smoking further compromises lung function."],"set":12,"tid":"419614934","vset":1},
      {"id":12,"qid":"11252","topic":"Tetralogy of Fallot","type":"single","fix":null,"opts":["Administer a stat dose of IV furosemide.","Place the infant in a knee-chest position.","Prepare for immediate endotracheal intubation.","Apply a cold compress to the infant's forehead."],"ans":[2],"stem":"The nurse is caring for an 18-month-old client with Tetralogy of Fallot who is experiencing a hypercyanotic spell (\"tet spell\"). Which of the following actions should the nurse implement first?","exp":["A hypercyanotic (\"tet\") spell is caused by a sudden increase in right-to-left shunting of deoxygenated blood across the ventricular septal defect. Placing the infant in a knee-chest position kinks the femoral arteries, increasing systemic vascular resistance (SVR). This forces more blood from the right ventricle into the pulmonary artery, improving pulmonary blood flow and oxygenation."],"set":13,"tid":"418215528","vset":1},
      {"id":13,"qid":"11779","topic":"Paracentesis","type":"single","fix":"Topic corrected: stem describes post-paracentesis assessment and delegation, not diabetic ketoacidosis.","opts":["Ask the UAP to obtain the client's vital signs.","Assess the client's symptoms as reported by the UAP.","Instruct the UAP to assist the client back to bed immediately.","Review the client's prescribed diuretic medications."],"ans":[2],"stem":"The nurse and unlicensed assistive personnel (UAP) are caring for a client who had a paracentesis 4 hours ago. The UAP reports that the client appears lightheaded and unsteady during ambulation to the bathroom. Which of the following actions should the nurse take first?","exp":["When a UAP reports a change in a client's condition, the nurse's first action is to personally assess the client to validate the findings and determine the severity of the situation. After assessing the client, the nurse can then delegate tasks or implement interventions."],"set":10,"tid":"419506277","vset":1},
      {"id":14,"qid":"39550","topic":"Vasovagal Syncope","type":"single","fix":null,"opts":["I will continue to lift weights at the gym three times a week.","I will avoid rubbing my eyes or putting pressure on my eyelids.","I will stop brushing my tongue to avoid triggering my gag reflex.","I will take stool softeners to prevent straining with bowel movements."],"ans":[1],"stem":"The nurse is teaching a client who has vasovagal syncope. Which of the following statements by the client would require follow-up?","exp":["Vasovagal syncope is triggered by a sudden drop in heart rate and blood pressure, often provoked by the Valsalva maneuver (e.g., heavy weightlifting, straining during bowel movements), strong emotions, painful stimuli, or carotid stimulation. The client must be taught to avoid heavy lifting and straining."],"set":15,"tid":"419506277","vset":1}
    ]};
    const DUP_NOTE="Item ID 7 was removed from the corrected set: it is an exact duplicate of ID 3 (same Qld 44891, stem, options, and key).";

    const $=s=>document.querySelector(s);
    const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    const TYPE_LABEL={single:'Multiple choice (single answer)',multi:'Select all that apply',highlight:'Highlight / select findings',matrix:'Matrix: anticipated vs not anticipated'};
    let S=null,notesStore={};

    function correctedItems(){return D.items.filter(i=>i.vset).slice().sort((a,b)=>a.id-b.id)}
    function setCounts(){
      return{
        vset:correctedItems().length,
        s9:D.items.filter(i=>i.set==9).length,
        s1:D.items.filter(i=>i.set==1).length,
        s2:D.items.filter(i=>i.set==2).length,
        s3:D.items.filter(i=>i.set==3).length
      };
    }

    function home(){
      S=null;
      const c=setCounts();
      const topics=[...new Set(correctedItems().map(i=>i.topic))].sort();
      const rows=correctedItems().map(i=>`<tr><td><b>${i.id}</b></td><td>${esc(i.topic)}</td><td>${esc(TYPE_LABEL[i.type]||i.type)}</td><td>${esc(i.qid)}</td><td>${esc(i.tid)}</td><td>${i.fix?`<span class="fix">Corrected:</span> ${esc(i.fix)}`:'<span class="okc">Verified - no change</span>'}</td></tr>`).join('');
      $('#app').innerHTML=`<div class="home">
        <h2>NCLEX Practice Test - Verified Case Sets</h2>
        <div class="card">
          <p><b>Tutored, Untimed.</b> Pick an answer, press <b>Submit</b>, and the explanation appears on the right. Time spent on each question is tracked and reported at the end with the score and MAX.</p>
          <label>Question bank</label>
          <select id="ss">
            <option value="v" selected>Verified case set - corrected items, organized by ID (${c.vset} items)</option>
            <option value="9">Verified case set - sickle cell, Items 1-6 (rebuilt from source) (${c.s9})</option>
            <option value="1">Set 1 - self-assessment 1 (${c.s1})</option>
            <option value="2">Set 2 - self-assessment 2 (${c.s2})</option>
            <option value="3">Set 3 - large bank (${c.s3})</option>
          </select>
          <label>Topic (optional, applies to the corrected set)</label>
          <select id="tp"><option value="">All topics</option>${topics.map(t=>`<option>${esc(t)}</option>`).join('')}</select>
          <p style="margin-top:14px"><button class="btn p" onclick="go()">Start test</button></p>
          <p class="chip">Each item shows its Test Id (Tutored, Untimed) and Qld (${ACCT}). Corrected items live only in their own verified case set - they are not added to the self-assessments or the large bank.</p>
        </div>
        <div class="card">
          <h3 style="margin-top:0">Corrected items, organized by ID</h3>
          <table class="sum"><tr><th>ID</th><th>Topic</th><th>Type</th><th>Qld</th><th>Test Id</th><th>Review note</th></tr>${rows}</table>
          <p class="chip">${esc(DUP_NOTE)}</p>
        </div>
      </div>`;
    }

    function go(){
      const s=$('#ss').value,t=$('#tp')?$('#tp').value:'';
      let pool;
      if(s=='v'){pool=correctedItems().filter(i=>!t||i.topic==t)}
      else{pool=D.items.filter(i=>i.set==+s)}
      if(!pool.length){alert('No items in this selection.');return}
      S={pool:pool.slice().sort((a,b)=>a.id-b.id),i:0,a:{},sub:{},t:{},flag:{},ts:Date.now(),cq:null,tid:String(10000+Math.floor(Math.random()*89999))};
      show();
    }

    function cur(){return S.pool[S.i]}

    function correct(q,a){
      if(q.type=='single')return a&&a[0]==q.ans[0]?[1,1]:[0,1];
      if(q.type=='multi'||q.type=='highlight'){
        const A=a||[];let r=0,w=0;
        A.forEach(x=>{q.ans.includes(x)?r++:w++});
        return [Math.max(0,r-w),q.ans.length];
      }
      if(q.type=='matrix'){
        let g=0;
        q.opts.forEach((o,i)=>{const exp=q.ans.includes(i+1)?1:0;const got=(a&&a[i]!=null)?a[i]:-1;if(got===exp)g++});
        return [g,q.opts.length];
      }
      return [0,1];
    }

    function bank(){const n=Date.now();if(S.cq!=null&&!S.sub[S.cq])S.t[S.cq]=(S.t[S.cq]||0)+(n-S.ts)/1000;S.ts=n;S.cq=cur().id}
    function fmtT(x){x=Math.round(x||0);const m=Math.floor(x/60),s=x%60;return (m?m+(m>1?' mins ':' min '):'')+String(s).padStart(2,'0')+' s'}

    function optRow(q,i,sub,a){
      const n=i+1,sel=!sub&&((q.type=='single'||q.type=='multi'||q.type=='highlight')?(a||[]).includes(n):false);
      let cls='opt',mark='';
      if(sub){
        const isAns=q.ans.includes(n);
        const chosen=(a||[]).includes(n);
        if(q.type=='single'||q.type=='multi'||q.type=='highlight'){
          if(isAns){cls+=' ok';mark='<span class="mark">&#10003; Correct</span>'}
          else if(chosen){cls+=' no';mark='<span class="mark">&#10007; Incorrect</span>'}
        }
      }
      return `<div class="${cls}" ${sub?'':`onclick="pick(${n})"`}><span class="k">${sel?'&#10003;':n}</span><span>${esc(q.opts[i])}</span>${mark}</div>`;
    }

    function show(){
      bank();
      const q=cur(),n=S.pool.length,sub=!!S.sub[q.id],a=S.a[q.id];
      const [g,m]=sub?correct(q,a):[0,0];
      const idx=S.i+1;
      const head=`<div class="hd">
        <div class="l"><b>${esc(q.topic)}</b> - Item ${idx} of ${n} (ID ${q.id})<br>
        <span style="opacity:.85">Test Id: <b>${esc(q.tid||S.tid)}</b> (Tutored, Untimed) &nbsp;|&nbsp; Qld: <b>${esc(q.qid||'-')}</b> (${ACCT})</span></div>
        <div class="r"><button onclick="notes()">Notes</button><button onclick="calc()">Calculator</button><button class="flagbtn ${S.flag[q.id]?'on':''}" onclick="flag()">Flag</button><button onclick="end()">End</button></div>
      </div>`;
      let L=`<div class="pane"><p class="c">REVIEW - Question <b>${idx}</b> of <b>${n}</b> &nbsp;|&nbsp; ${esc(TYPE_LABEL[q.type]||q.type)}</p>
        <p class="item">${esc(q.topic)} (Item ID ${q.id})</p>`;
      if(q.type=='matrix'){
        L+=`<p class="stem">${esc(q.stem)}</p>`;
        const rows=q.opts.map((o,i)=>{
          const exp=q.ans.includes(i+1);
          const got=(sub&&a&&a[i]!=null)?a[i]:null;
          let badge='';
          if(sub){const ok=(got===(exp?1:0));badge=`<span class="mark" style="color:${ok?'var(--ok)':'var(--no)'}">${ok?'&#10003;':'&#10007;'} ${exp?'Anticipated':'Not anticipated'}</span>`}
          const b1=`<button class="mxbtn ${got===1?'on':''}" ${sub?'disabled':''} onclick="mx(${i},1)">Anticipated</button>`;
          const b0=`<button class="mxbtn ${got===0?'on':''}" ${sub?'disabled':''} onclick="mx(${i},0)">Not anticipated</button>`;
          return `<div class="mxrow"><span class="lbl">${esc(o)}</span>${b1}${b0}${badge}</div>`;
        }).join('');
        L+=`<div>${rows}</div>`;
      }else{
        L+=`<p class="stem">${esc(q.stem)}</p>`;
        if(q.type=='multi')L+=`<p class="ins">Select all that apply.</p>`;
        if(q.type=='highlight')L+=`<p class="ins">Click to highlight the findings that require immediate follow-up.</p>`;
        L+=q.opts.map((o,i)=>optRow(q,i,sub,a)).join('');
      }
      L+=`</div>`;
      let R=`<div class="pane">`;
      if(!sub){
        R+=`<p class="ins">${q.type=='single'?'Select the best answer.':q.type=='matrix'?'Classify each intervention, then submit.':'Select your answer(s), then submit.'}</p>
          <p><button class="btn p" onclick="submit()">Submit</button></p>
          <p class="chip">Tutored mode: the explanation and correct answers appear here after you submit.</p>`;
      }else{
        R+=`<div class="sc ${g==m?'':'bad'}"><span><b>${g==m?'&#10003; Correct':(g>0?'~ Partly correct':'&#10007; Incorrect')}</b></span><span>Score: <b>${g} of ${m}</b> correct</span><span>Time on this item: <b>${fmtT(S.t[q.id]||0)}</b></span></div>`;
        R+=`<div class="exp"><h4>Rationale</h4>${q.exp.map(e=>`<p>${esc(e)}</p>`).join('')}</div>`;
        if(q.fix)R+=`<div class="sc bad"><span><b>Correction applied:</b> ${esc(q.fix)}</span></div>`;
      }
      R+=`</div>`;
      const ft=`<div class="ft"><button onclick="end()">End</button><span class="sp"></span>
        <button ${S.i==0?'disabled':''} onclick="mv(-1)">&larr; Prev</button>
        <span style="font-size:12.5px">${idx} / ${n}</span>
        <button ${S.i==n-1?'disabled':''} onclick="mv(1)">Next &rarr;</button></div>`;
      $('#app').innerHTML=head+`<div class="main">`+L+R+`</div>`+ft;
    }

    function mv(d){S.i=Math.max(0,Math.min(S.pool.length-1,S.i+d));show()}
    function pick(k){
      const q=cur();if(S.sub[q.id])return;
      let a=S.a[q.id]||[];
      if(q.type=='single')a=[k];
      else a=a.includes(k)?a.filter(x=>x!=k):a.concat(k);
      S.a[q.id]=a;show();
    }
    function mx(i,v){
      const q=cur();if(S.sub[q.id])return;
      let a=(typeof S.a[q.id]=='object'&&S.a[q.id]&&!Array.isArray(S.a[q.id]))?S.a[q.id]:{};
      a[i]=v;S.a[q.id]=a;show();
    }
    function submit(){
      const q=cur(),a=S.a[q.id];
      let empty=false;
      if(q.type=='matrix'){empty=!a||!q.opts.some((o,i)=>a[i]!=null)}
      else empty=!a||!a.length;
      if(empty){alert('Please select an answer before submitting.');return}
      bank();S.sub[q.id]=true;show();
    }
    function flag(){const q=cur();S.flag[q.id]=!S.flag[q.id];show()}

    function modal(h){$('#mod').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div class="mb">${h}<button class="btn x" onclick="closeM()">&#10005;</button></div></div>`}
    function closeM(){$('#mod').innerHTML=''}
    function notes(){
      const q=cur();
      modal(`<h3 style="margin-top:0">Notes - Item ID ${q.id}</h3><textarea id="ntx" rows="6" placeholder="Your notes for this item...">${esc(notesStore[q.id]||'')}</textarea><p><button class="btn p" onclick="notesStore[${q.id}]=document.getElementById('ntx').value;closeM()">Save</button></p>`);
    }
    function calc(){
      let expr='';
      modal(`<h3 style="margin-top:0">Calculator</h3><input id="cld" readonly value=""><div class="kp">${['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+'].map(k=>`<button onclick="ck('${k}')">${k}</button>`).join('')}</div><p><button class="btn" onclick="ck('C')">Clear</button></p>`);
    }
    function ck(k){
      const d=document.getElementById('cld');
      if(k=='C'){d.value='';return}
      if(k=='='){try{d.value=String(Function('"use strict";return ('+d.value+')')())}catch(e){d.value='Error'}return}
      d.value+=k;
    }

    function end(){
      if(!confirm('End this test and see your score?'))return;
      bank();
      let g=0,m=0,wrong=[],total=0;
      S.pool.forEach((q,i)=>{
        if(S.sub[q.id]){const r=correct(q,S.a[q.id]);g+=r[0];m+=r[1];if(r[0]<r[1])wrong.push(i)}
        total+=(S.t[q.id]||0);
      });
      const answered=Object.keys(S.sub).length;
      const pct=m?Math.round(g*100/m):0;
      const rows=S.pool.map((q,i)=>{
        const sub=!!S.sub[q.id];
        const r=sub?correct(q,S.a[q.id]):[0,0];
        return `<tr><td>${i+1}</td><td>${q.id}</td><td>${esc(q.topic)}</td><td>${esc(q.qid)}</td><td>${esc(q.tid)}</td><td>${sub?(r[0]+'/'+r[1]):'Not answered'}</td><td>${fmtT(S.t[q.id]||0)}</td><td>${S.flag[q.id]?'&#9873;':''}</td></tr>`;
      }).join('');
      $('#app').innerHTML=`<div class="home"><div class="card">
        <h2 style="margin-top:0">Test - results</h2>
        <div class="big">${pct}% Secured / MAX: ${g}/${m}</div>
        <p><b>Time spent on test:</b> ${fmtT(total)} &nbsp;|&nbsp; <b>Answered:</b> ${answered} of ${S.pool.length} &nbsp;|&nbsp; Bank: Tutored, Untimed (Qld ${ACCT})</p>
        ${wrong.length?`<p><b>Review incorrect:</b></p><div class="grid">${wrong.map(i=>`<button onclick="S.i=${i};show()">Item ${i+1} (ID ${S.pool[i].id})</button>`).join('')}</div>`:'<p class="okc" style="font-weight:700">All submitted items fully correct.</p>'}
        <table class="res"><tr><th>#</th><th>Item ID</th><th>Topic</th><th>Qld</th><th>Test Id</th><th>Score</th><th>Time spent</th><th>Flag</th></tr>${rows}</table>
        <p style="margin-top:14px"><button class="btn p" onclick="home()">New test</button></p>
      </div></div>`;
    }

    home();
  </script>
</body>
</html>

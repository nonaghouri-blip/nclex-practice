<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NCLEX Practice Test - Verified Case Sets</title>
  <style>
    :root{--bg:#eef1f5;--card:#fff;--tx:#1d2733;--mu:#667487;--bd:#d6dce4;--hd:#0b5ea8;--tb:#6ea6dc;--ok:#1a7f45;--okb:#e3f4ec;}
    @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f141a;--card:#18202a;--tx:#e6ebf1;--mu:#95a2b3;--bd:#2c3744;--hd:#0b4f8c;--tb:#2f5f8f;--ok:#4cc27f;--okb:#12301f;}}
    *{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--tx);font:15px/1.5 Arial,Helvetica,sans-serif;margin:0}#app{flex:1;display:flex;flex-direction:column;min-height:0}
    .hd{background:var(--hd);color:#fff;display:flex;align-items:center;gap:12px;padding:6px 12px;font-size:12.5px}.hd .l{float:left}.hd .r{float:right}
    .main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);min-height:0}
    .pane{overflow:auto;padding:14px 16px;background:var(--card)}.pane+.pane{border-left:1px solid var(--bd)}
    @media(max-width:760px){.main{display:block;overflow:auto}.pane{overflow:visible}.pane+.pane{border-left:0;border-top:1px solid var(--bd)}}
    .item{font-weight:700;margin:0 0 6px}.intro{margin:0 0 10px}
    .tabs{display:flex;gap:4px;flex-wrap:wrap}.tabs button{border:1px solid var(--bd);border-bottom:0;background:var(--bg);color:var(--tx);padding:3px 8px;font-size:13px;flex-wrap:wrap}
    .tabbody{border:1px solid var(--bd);padding:10px 14px;margin-bottom:12px;background:var(--card);max-height:46vh;overflow}
    .pic{border:1px dashed var(--mu);border-radius:8px;padding:12px;margin:0 0 12px;text-align:center;color:var(--mu);background:var(--bg)}
    .pic.miss{border-color:var(--no);color:var(--no)}
    .stem{font-size:16px;margin:8px 0 12px}.ins{color:var(--hd);font-weight:700;margin:0 0 8px}[data-theme=dark] .ins{color:#e6ebf1}
    .opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;margin:6px 0;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
    .opt.sel{background:var(--sel);border-color:var(--hd)}.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);color:var(--no)}
    .opt .k{flex:none;width:22px;height:22px;border:1.5px solid var(--mu);border-radius:50%;display:flex;align-items:center}
    .mark{margin-left:auto;font-weight:700}.ok .mark{color:var(--ok)}.no .mark{color:var(--no)}
    .sc{border-left:4px solid var(--ok);background:var(--bg);padding:8px 12px;margin:12px 0;font-size:13px;display:flex;gap:}
    .exp{border-top:1px solid var(--bd);padding-top:8px}.exp h4{margin:6px 0;color:var(--hd)}
    .btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 16px;border-radius:8px;cursor:pointer}
    .ft{background:var(--hd);color:#fff;display:flex;align-items:center;padding:6px 10px;gap:8px;padding-bottom:calc(6px + 1vmin)}
    .chip{color:var(--mu);font-size:13px}.warn{background:var(--nob);color:var(--no);border:1px solid var(--nob)}
    .home{max-width:640px;margin:0 auto;padding:18px}.home .card{background:var(--card);border:1px solid var(--bd);border-radius:6px}
    .chip{color:var(--mu);font-size:13px}
  </style>
</head>
<body>
  <div id="app">
    <div id="mod"></div>
    <script>
      const ACCT='6300643';
const D={"items": [{"id": 1, "qid": "11552", "topic": "Anaphylaxis", "type": "single", "item": "1 of 6", "intro": null, "tabs": [], "imgs": [], "stem": "The nurse is caring for a client who has developed a widespread blistering rash and mucosal erosions after starting a new antibiotic. Which of the following actions should the nurse take first?", "exp": ["The clinical presentation is highly suggestive of Stevens-Johnson Syndrome (SJS), a severe, life-threatening mucocutaneous reaction often triggered by medications. The absolute first priority is to discontinue the causative agent to prevent further progression of the disease."], "set": 9, "weak": false, "opts": ["Apply a topical corticosteroid to the affected areas.", "Discontinue the suspected offending medication immediately.", "Obtain a wound culture from the blistered areas.", "Administer an oral antihistamine for pruritus."], "ans": [2], "tid": "419530942"}, {"id": 2, "qid": "11552", "topic": "Anaphylaxis", "type": "single", "item": "3 of 6", "intro": null, "tabs": [], "imgs": [], "stem": "Complete the following sentence by choosing from the list of options. The nurse recognizes the client is experiencing anaphylaxis and should anticipate an immediate order for ______________.", "exp": ["IM epinephrine is the first-line, life-saving treatment for anaphylaxis. It acts rapidly to cause vasoconstriction (reversing hypotension and edema) and bronchodilation (reversing wheezing and hypoxia). Antihistamines and corticosteroids are secondary treatments."], "set": 9, "weak": false, "opts": ["IV diphenhydramine push", "Intramuscular (IM) epinephrine", "Nebulized albuterol", "IV methylprednisolone"], "ans": [2], "tid": "419530942"}, {"id": 3, "qid": "44891", "topic": "Lithium Therapy", "type": "single", "item": "1 of 6", "intro": null, "tabs": [], "imgs": [], "stem": "The nurse is talking with a client who is receiving lithium. The client has a therapeutic serum lithium level and reports increased urination. Which of the following orders should the nurse expect?", "exp": ["Mild polyuria and thirst are common, expected side effects of therapeutic lithium levels due to its effect on the kidneys (nephrogenic diabetes insipidus). Since the level is therapeutic and renal function is normal, the nurse should expect the provider to continue the current dose while monitoring."], "set": 3, "weak": false, "opts": ["Continue taking lithium at the current dose.", "Discontinue lithium immediately and switch to valproic acid.", "Administer IV sodium polystyrene sulfonate.", "Hold the next dose of lithium and recheck levels in 4 hours."], "ans": [1], "tid": "418225859"}, {"id": 4, "qid": "44988", "topic": "Sickle Cell", "type": "single", "item": "1 of 6", "intro": null, "tabs": [], "imgs": [], "stem": "Click to highlight the 4 findings below that require immediate follow-up.", "exp": ["Sickle cell acute pain episodes result from vaso-occlusive ischemia and cause tachycardia, leukocytosis, reticulocytosis, and bone pain. The elevated reticulocyte count is an expected compensatory response to chronic hemolysis, but the pain, tachycardia, and tachypnea require immediate intervention."], "set": 9, "weak": false, "opts": ["Pain rated as 9/10 in the upper back, knees, and lower legs", "Restlessness and facial grimacing", "Heart rate of 120 bpm", "Reticulocyte count of 5%", "SpO2 95% on room air with respiratory rate of 24 breaths/min"], "ans": [1, 2, 3, 5], "tid": "418225859"}, {"id": 5, "qid": "44891", "topic": "Lithium Therapy", "type": "single", "item": "3 of 6", "intro": null, "tabs": [], "imgs": [], "stem": "Complete the following sentence by choosing from the list of options. The nurse recognizes that the client is experiencing a vaso-occlusive crisis and should anticipate an order for ______________.", "exp": ["The priority treatment for a sickle cell vaso-occlusive crisis is rapid pain management (typically with IV opioids) and aggressive IV hydration to decrease blood viscosity, improve microcirculation, and help clear sickled cells."], "set": 5, "weak": false, "opts": ["Subcutaneous enoxaparin", "IV opioid analgesics and aggressive IV hydration", "Oral hydroxyurea as a stat dose", "Immediate blood transfusion of packed RBCs"], "ans": [2], "tid": "418225859"}, {"id": 6, "qid": "40238", "topic": "STEMI", "type": "matrix", "item": "2 of 6", "intro": null, "tabs": [], "imgs": [], "stem": "For each potential intervention, click to specify if the intervention is anticipated or not anticipated for the immediate care of this client.", "exp": ["For a client diagnosed with STEMI, the nurse should anticipate maintaining airway patency, administering aspirin to decrease platelet aggregation, giving nitroglycerin to promote coronary artery vasodilation, and preparing the client for immediate reperfusion therapy (e.g., PCI)."], "set": 2, "weak": false, "opts": ["Administer chewable aspirin 324 mg PO", "Administer sublingual nitroglycerin", "Prepare the client for percutaneous coronary intervention (PCI)", "Obtain a stat D-dimer level"], "ans": [1, 2, 3], "tid": "419506277"}, {"id": 7, "qid": "44891", "topic": "Lithium Therapy", "type": "single", "item": "5 of 6", "intro": null, "tabs": [], "imgs": [], "stem": "The nurse is talking with a client who is receiving lithium. The client has a therapeutic serum lithium level and reports increased urination. Which of the following orders should the nurse expect?", "exp": ["Mild polyuria and thirst are common, expected side effects of therapeutic lithium levels due to its effect on the kidneys (nephrogenic diabetes insipidus). Since the level is therapeutic and renal function is normal, the nurse should expect the provider to continue the current dose while monitoring."], "set": 3, "weak": false, "opts": ["Continue taking lithium at the current dose.", "Discontinue lithium immediately and switch to valproic acid.", "Administer IV sodium polystyrene sulfonate.", "Hold the next dose of lithium and recheck levels in 4 hours."], "ans": [1], "tid": "418225859"}, {"id": 8, "qid": "11552", "topic": "Anaphylaxis", "type": "matrix", "item": "4 of 6", "intro": null, "tabs": [], "imgs": [], "stem": "For each potential intervention, click to specify if the intervention is anticipated or not anticipated for the care of this client.", "exp": ["If knee-chest positioning is insufficient, medical management includes calming the child (morphine), providing oxygen, and administering IV fluids to increase preload and push more blood through the pulmonary circulation."], "set": 9, "weak": false, "opts": ["Administer IV morphine sulfate", "Provide 100% supplemental oxygen via blow-by", "Encourage the parent to continue comforting the child loudly", "Administer IV fluids to increase preload"], "ans": [1, 2, 4], "tid": "419530942"}, {"id": 9, "qid": "11779", "topic": "Diabetic Ketoacidosis", "type": "highlight", "item": "1 of 6", "intro": null, "tabs": [], "imgs": [], "stem": "Click to highlight the 4 findings below that require immediate follow-up.", "exp": ["These findings indicate Diabetic Ketoacidosis (DKA) with moderate to severe dehydration and metabolic acidosis. Kussmaul respirations are a compensatory mechanism to blow off excess CO2. Hypotension and tachycardia indicate hypovolemia requiring immediate fluid resuscitation."], "set": 9, "weak": false, "opts": ["Confusion and deep, rapid breathing (Kussmaul respirations)", "Dry mucous membranes and poor skin turgor", "Blood pressure of 92/60 mm Hg and heart rate of 122 bpm", "Random glucose of 573 mg/dL and pH of 7.25", "Temperature of 100.4°F (38.0°C)"], "ans": [1, 2, 3, 4], "tid": "418215528"}, {"id": 10, "qid": "11779", "topic": "Diabetic Ketoacidosis", "type": "matrix", "item": "4 of 6", "intro": null, "tabs": [], "imgs": [], "stem": "For each potential intervention, click to specify if the intervention is anticipated or not anticipated for the care of this client.", "exp": ["The priority treatment for DKA is aggressive IV fluid resuscitation to restore intravascular volume, followed by a continuous IV regular insulin infusion to lower blood glucose and halt ketone production. Subcutaneous long-acting insulin is not appropriate for acute management."], "set": 9, "weak": false, "opts": ["Initiate IV fluid resuscitation with 0.9% NaCl", "Start continuous IV regular insulin infusion", "Administer subcutaneous long-acting insulin", "Frequent checks of arterial blood gas levels"], "ans": [1, 2, 4], "tid": "418215528"}, {"id": 11, "qid": "11450", "topic": "Ankylosing Spondylitis", "type": "multi", "item": "2 of 6", "intro": null, "tabs": [], "imgs": [], "stem": "The nurse is teaching a client newly diagnosed with ankylosing spondylitis. Which of the following statements by the client would indicate a correct understanding of the teaching? Select all that apply.", "exp": ["Management of ankylosing spondylitis focuses on maintaining spinal mobility and posture. Exercises that promote spine extension (e.g., swimming) are highly recommended. Bed rest is discouraged as it worsens stiffness. Smoking cessation is critical because the disease can restrict chest expansion, and smoking further compromises lung function."], "set": 12, "weak": false, "opts": ["I should practice daily stretching and spine-stretching exercises.", "Swimming is a good form of exercise for me because it promotes spine extension.", "I should rest in bed as much as possible to avoid worsening the pain.", "I need to stop smoking to reduce the risk of lung complications."], "ans": [1, 2, 4], "tid": "419614934"}, {"id": 12, "qid": "11252", "topic": "Tetralogy of Fallot", "type": "single", "item": "1 of 6", "intro": null, "tabs": [], "imgs": [], "stem": "The nurse is caring for an 18-month-old client with Tetralogy of Fallot who is experiencing a hypercyanotic spell (\"tet spell\"). Which of the following actions should the nurse implement first?", "exp": ["A hypercyanotic (\"tet\") spell is caused by a sudden increase in right-to-left shunting of deoxygenated blood across the ventricular septal defect. Placing the infant in a knee-chest position kinks the femoral arteries, increasing systemic vascular resistance (SVR). This forces more blood from the right ventricle into the pulmonary artery, improving pulmonary blood flow and oxygenation."], "set": 13, "weak": false, "opts": ["Administer a stat dose of IV furosemide.", "Place the infant in a knee-chest position.", "Prepare for immediate endotracheal intubation.", "Apply a cold compress to the infant's forehead."], "ans": [2], "tid": "418215528"}, {"id": 13, "qid": "11779", "topic": "Diabetic Ketoacidosis", "type": "single", "item": "1 of 6", "intro": null, "tabs": [], "imgs": [], "stem": "The nurse and unlicensed assistive personnel (UAP) are caring for a client who had a paracentesis 4 hours ago. The UAP reports that the client appears lightheaded and unsteady during ambulation to the bathroom. Which of the following actions should the nurse take first?", "exp": ["When a UAP reports a change in a client's condition, the nurse's first action is to personally assess the client to validate the findings and determine the severity of the situation. After assessing the client, the nurse can then delegate tasks or implement interventions."], "set": 10, "weak": false, "opts": ["Ask the UAP to obtain the client's vital signs.", "Assess the client's symptoms as reported by the UAP.", "Instruct the UAP to assist the client back to bed immediately.", "Review the client's prescribed diuretic medications."], "ans": [2], "tid": "419506277"}, {"id": 14, "qid": "39550", "topic": "Vasovagal Syncope", "type": "single", "item": "1 of 6", "intro": null, "tabs": [], "imgs": [], "stem": "The nurse is teaching a client who has vasovagal syncope. Which of the following statements by the client would require follow-up?", "exp": ["Vasovagal syncope is triggered by a sudden drop in heart rate and blood pressure, often provoked by the Valsalva maneuver (e.g., heavy weightlifting, straining during bowel movements), strong emotions, painful stimuli, or carotid stimulation. The client must be taught to avoid heavy lifting and straining."], "set": 15, "weak": false, "opts": ["I will continue to lift weights at the gym three times a week.", "I will avoid rubbing my eyes or putting pressure on my eyelids.", "I will stop brushing my tongue to avoid triggering my gag reflex.", "I will take stool softeners to prevent straining with bowel movements."], "ans": [1], "tid": "419506277"}]
};
      const $=s=>document.querySelector(s);
      const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&','<':'<','>':'>','"':'"'}[c]));
      const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
      let S=null,tabSel=0;

      function home(){
        S=null;
        const topics=[...new Set(D.items.map(i=>i.topic.split(' ')[0]).filter(Boolean))];
        const first=[...new Set(D.items.map(i=>i.topic).filter(Boolean))].sort();
        $('#app').innerHTML=`<div class="home"><h2>NCLEX Practice Test - Verified Case Sets</h2>
        <div class="card"><p>Tutored, untimed. Pick an answer, press <b>Submit</b>, and the explanation appears on the right. Every attempt is reshuffled.</p>
        <label>Question bank</label><select id="ss"><option value="0">All verified case sets (${D.items.filter(i=>i.set&&i.set==9||i.set==5).length})</option><option value="9">Verified case set - sickle cell, Items 1-6 (rebuilt from source)</option><option value="5">Case-study screenshot review (${D.items.filter(i=>i.type=='shot').length} source pages, in order)</option><option value="1">Set 1 - self-assessment 1</option><option value="2">Set 2 - self-assessment 2</option><option value="3">Set 3 - large bank</option></select>
        <label>Topic (optional)</label><select id="tp"><option value="">All topics</option>${first.map(t=>`<option>${esc(t)}</option>`).join('')}</select>
        <label>Questions in this test</label><select id="cc"><option>25</option><option>50</option><option selected>100</option><option value="0">All in selection</option></select>
        <p><button class="btn p" onclick="go()">Start test</button></p>
        <p class="chip">Qld, Test Id and source question numbers are read from the original screenshots. Case-study pages whose question text was never captured are shown as the original screenshot (review only). Items with a red box are missing a picture in the source.</p></div></div>`;
      }

      function go(){
        const s=+$('#ss').value,t=$('#tp').value,c=+$('#cc').value;
        let pool=D.items.filter(i=>(s?i.set==s:i.type!='shot')&&(!t||i.topic==t));
        if(s==9)pool.sort((a,b)=>a.id-b.id);else if(s==5)pool.sort((a,b)=>(a.tid||'').localeCompare(b.tid||'')||(+a.qid||0)-(+b.qid||0)||a.id-b.id);else pool=shuffle(pool);
        if(c&&pool.length>c)pool=pool.slice(0,c);
        S={pool,i:0,a:{},sub:{},flag:{},note:{},t:{},ts:Date.now(),cq:null,tid:String(10000+Math.floor(Math.random()*89999))};
        show();
      }

      function go(){const s=+$('#ss').value,t=$('#tp').value,c=+$('#cc').value;let pool=D.items.filter(i=>(s?i.set==s:i.type!='shot')&&(!t||i.topic==t));if(s==9)pool.sort((a,b)=>a.id-b.id);else if(s==5)pool.sort((a,b)=>(a.tid||'').localeCompare(b.tid||'')||(+a.qid||0)-(+b.qid||0)||a.id-b.id);else pool=shuffle(pool);if(c&&pool.length>c)pool=pool.slice(0,c);S={pool,i:0,a:{},sub:{},flag:{},note:{},t:{},ts:Date.now(),cq:null,tid:String(10000+Math.floor(Math.random()*89999))};show()}

      function cur(){return S.pool[S.i];}
      function rule(q){return q.type=='multi'||(q.type=='matrix'&&!q.single)?'+/-':'0/1'}
      function correct(q,a){
        if(q.type=='single')return a&&a[0]==q.ans[0]?[1,1]:[0,1];
        if(q.type=='multi'){const A=a||[];let r=0,w=0;A.forEach(x=>q.ans.includes(x)?r++:w++);return [Math.max(0,r-w),q.ans.length]}
        if(q.type=='matrix'){let g=0;q.rows.forEach((r,i)=>{const x=((a||{})[i]||[]).slice().sort().join(),y=r[1].slice().sort().join();g+=x===y?1:0});return [g,q.rows.length]}
        return [0,1]
      }
      function bank(){const n=Date.now();if(S.cq!=null&&!S.sub[S.cq])S.t[S.cq]=(S.t[S.cq]||0)+(n-S.ts)/1000;S.ts=n;S.cq=cur().id}
      function fmtT(x){x=Math.round(x||0);const m=Math.floor(x/60),s=x%60;return (m?m+(m>1?' mins, ':' min, '):'')+String(s).padStart(2,'0')}

      function show(){
        bank();
        const q=cur(),n=S.pool.length,sub=S.sub[q.id],a=S.a[q.id];
        const [g,m]=sub?correct(q,a):[0,0];
        const head=`<div class="hd"><div class="l">${esc(q.topic||'NCLEX')}<br><span style="opacity:.85">${q.item?'Item '+q.itm:''}</span><br><span style="opacity:.8">Test Id: <b>${q.tid||S.tid}</b> (Tutored, Untimed)<br>Qld: <b>${q.qid||'-'}</b> (${ACCT})</span></div><div class="r"><button onclick="notes()">?? Notes</button><button onclick="calc()">?? Calculator</button><button onclick="end()">? End</button></div>`
        const c=`<div class="c">REVIEW<br>Question <b>${S.i+1}</b> of <b>${n}</b>${q.src?`<br><span style="opacity:.8">source: Q ${q.src.qn||'?'} of ${q.src.of||100} � Qld ${q.qid}${q.src.?}</span>`:''}</div>`
        const r=`<div class="r"><p class="ins">Select the best answer.</p><p><button class="btn p" onclick="submit()">Submit</button></p><span class="sc ${g==m?'':'bad'}"><span>${g==m?'? Correct':'? '+(g?'Partly correct':'Incorrect')}</span><span>? ${g} of ${m} correct</span></span></div>`
        const L=`${q.type=='shot'?'<div class="pane" style="flex:1;overflow:auto"><p class="chip">Case-study exhibit</p><p class="chip">Source screenshot � Qld ${q.qid}</p>'+(q.imgs?q.imgs.map(x=>`<img src="${x}" alt="Exhibit">`).join(''):'')+(q.missing?'<div class="pic miss">?? [PICTURE PLACEHOLDER: Exhibit / Chart / Image]<br>'+esc(q.missing)+'</div>':'')+'</div>':''
        +(q.type=='single'?`<p class="stem">${q.type=='cloze'?'':esc(q.stem)}</p>`:'')
        +(q.type=='multi'?'<p class="ins">Select all that apply.</p>':'')
        +(q.type=='matrix'?'<p class="ins">Select all that apply in each column.</p>':'')
        +(q.type=='cloze'?'<p class="cl">'+(q.stem||'Complete the sentence by choosing from the list of options.')+'</p>':'')
        +(q.type=='num'?'<p><input class="n" inputmode="decimal" value="" inputmode="decimal" oninput="S.a[cur().id]=this.v"></p>':'')}</div>`
        const R=`${q.type=='single'?'Select the best answer.':''}
        +(q.type=='multi'?'<div class="opt" onclick="pick(1)"><span class="k">V</span><span>1</span></div><div class="opt" onclick="pick(2)"><span class="k">V</span><span>2</span></div>':'')
        +(q.type=='matrix'?'<table><tr><th>Item</th>${q.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>':''}

        $('#app').innerHTML=head+c+L+R
        <div class="ft"><button onclick="end()">? End</button><span class="sp"></span><button ${S.i==0?'disabled':''} onclick="show(S.i-1)">Prev</button><button ${S.i==n-1?'disabled':''} onclick="show(S.i+1)">Next</button></div>`
      }

      function mv(d){S.i=Math.max(0,Math.min(S.pool.length-1,S.i+d));tabSel=0;show()}
      function pick(k){const q=cur();if(S.sub[q.id])return;let a=S.a[q.id]||[];if(q.type=='single')a=[k];else a=a.includes(k)?a.filter(x=>x!=k):a.concat(k);S.a[q.id]=a;show()}
      function mx(i,j){const q=cur();if(S.sub[q.id])return;const a=(typeof S.a[q.id]=='object'&&!Array.isArray(S.a[q.id])&&S.a){}}
      function submit(){const q=cur();if(S.a[q.id]==null||(Array.isArray(S.a[q.id])&&!S.a[q.id].length)){alert('Please select an answer');return}S.sub[q.id]=true;show()}
      function flag(){const q=cur();S.flag[q.id]=!S.flag[q.id];show()}
      function modal(h){$('#mod').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div class="mb">${h}<button onclick="closeM()">✕</button></div>`}
      function closeM(){$('#mod').innerHTML=''}
      function end(){if(!confirm('End this test and see your score?'))return;let g=0,m=0,wrong=[];S.pool.forEach((q,i)=>{if(S.sub[q.id]){const r=correct(q,S.a[q.id]);g+=r[0];m+=r[1];if(r[0]<r[1])wrong.push(i)})};const un=S.pool.length-Object.keys(S.sub).length;$('#app').innerHTML=`<div class="home"><div class="card"><h2>Test ${S.tid} - results</h2><div class="big">${m?Math.round(m*100/n)+'%':0}% Secured / MAX: ${m}/${n}</div><p><b>Review incorrect:</b></p><div class="grid">${wrong.map(i=>`<button class="w" onclick="S.i=${i};show()">${i+1}</b>`)}</div><p style="margin-top:14px"><button class="btn p" onclick="home()">New test</button> <button class="btn" onclick="show(${Object.keys(S.sub).length>0?Object.keys(S.sub).length-1:0})">Review incorrect</button></p></div></div>`}

      home();
    </script>
  </div>
</body>
</html>
